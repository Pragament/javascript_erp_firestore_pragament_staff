<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Admin Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="auth-screen" class="container-fluid vh-100 d-flex align-items-center justify-content-center">
        <div class="auth-card">
            <div class="text-center mb-4">
                <i class="bi bi-building" style="font-size: 4rem; color: #2c3e50;"></i>
                <h2 class="mt-3 fw-bold" style="color: #2c3e50;">School Admin Portal</h2>
                <p class="text-muted">Manage teacher assignments</p>
            </div>
            <button id="google-signin" class="btn btn-lg w-100" style="background: #2c3e50; color: white; border: none;">
                <i class="bi bi-google me-2"></i>Sign in with Google
            </button>
        </div>
    </div>

    <div id="main-app" class="d-none">
        <nav class="navbar navbar-expand-lg navbar-dark shadow-sm">
            <div class="container-fluid">
                <span class="navbar-brand fw-bold">
                    <i class="bi bi-building me-2"></i>School Admin Dashboard
                </span>
                <div class="d-flex align-items-center">
                    <span class="text-white me-3 d-none d-md-inline" id="user-email"></span>
                    <button id="signout-btn" class="btn btn-outline-light btn-sm">
                        <i class="bi bi-box-arrow-right"></i> Sign Out
                    </button>
                </div>
            </div>
        </nav>

        <div class="container-fluid py-4">
            <div class="row g-4">
                <div class="col-lg-5 col-xl-4">
                    <div class="card shadow-sm h-100">
                        <div class="card-header" style="background: #2c3e50; color: white;">
                            <h5 class="mb-0"><i class="bi bi-person-plus-fill me-2"></i>Assign Teacher to Section</h5>
                        </div>
                        <div class="card-body">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Select Section</label>
                                <select id="section-select" class="form-select form-select-lg">
                                    <option value="">Loading sections...</option>
                                </select>
                                <small class="text-muted">Sections are loaded from Firestore</small>
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Teacher's Google Email</label>
                                <input type="email" id="teacher-email" class="form-control form-control-lg" 
                                       placeholder="teacher@school.com" autocomplete="email">
                            </div>
                            <button id="assign-btn" class="btn btn-lg w-100" style="background: #2c3e50; color: white; border: none;">
                                <i class="bi bi-check-circle-fill me-2"></i>Assign Teacher
                            </button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-7 col-xl-8">
                    <div class="card shadow-sm">
                        <div class="card-header d-flex justify-content-between align-items-center" style="background: #34495e; color: white;">
                            <h5 class="mb-0"><i class="bi bi-people-fill me-2"></i>Teacher Assignments</h5>
                            <button id="refresh-btn" class="btn btn-sm btn-light">
                                <i class="bi bi-arrow-clockwise"></i> Refresh
                            </button>
                        </div>
                        <div class="card-body p-0">
                            <div class="table-responsive">
                                <table class="table table-hover mb-0">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Section Name</th>
                                            <th>Section ID</th>
                                            <th>Teacher Email</th>
                                            <th>Assigned By</th>
                                            <th class="text-center">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody id="assignments-table">
                                        <tr>
                                            <td colspan="5" class="text-center text-muted py-4">
                                                <div class="spinner-border spinner-border-sm me-2"></div>
                                                Loading assignments...
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="app.js"></script>
</body>
</html>
